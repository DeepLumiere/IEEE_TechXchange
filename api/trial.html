<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherQuest - Career Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Fira+Code:wght@400;600&display=swap');

        :root {
            --bg: #050b14;
            --surface: rgba(16, 23, 42, 0.85);
            --surface-hover: rgba(30, 41, 59, 0.95);
            --text: #e2e8f0;
            --text-muted: #64748b;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.8);
            --locked: #0f172a;
            --locked-border: #1e293b;
            --error: #ff2a2a;
            --error-glow: rgba(255, 42, 42, 0.5);
            --success: #00e676;
            --gold: #ffb300;
            --gold-glow: rgba(255, 179, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
        }

        /* Scanline Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 3px);
            pointer-events: none;
            z-index: 9999;
        }

        /* --- Header --- */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(5, 11, 20, 0.9);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 242, 254, 0.1);
        }

        h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
        }

        /* --- Views --- */
        .view {
            display: none;
            width: 100%;
            flex-grow: 1;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Map View (Route Style) --- */
        .map-section {
            width: 100%;
            max-width: 1300px;
            margin-bottom: 70px;
            position: relative;
        }

        .map-section h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
            padding-left: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .stage-track {
            display: flex;
            align-items: center;
            gap: 70px;
            padding: 30px 40px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--locked);
            background: rgba(16, 23, 42, 0.4);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }

        .stage-track::-webkit-scrollbar { height: 6px; }
        .stage-track::-webkit-scrollbar-track { background: var(--locked); border-radius: 3px; }
        .stage-track::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; box-shadow: 0 0 10px var(--primary); }

        /* Map Nodes */
        .map-node {
            background: var(--locked);
            border: 2px solid var(--locked-border);
            border-radius: 16px;
            width: 150px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: not-allowed;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            flex-shrink: 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Connecting Lines */
        .map-node:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -73px;
            top: 50%;
            transform: translateY(-50%);
            width: 70px;
            height: 4px;
            background: var(--locked-border);
            z-index: -1;
            transition: all 0.5s ease;
        }

        .map-node .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: grayscale(100%) opacity(0.2);
            transition: all 0.4s;
        }

        .map-node .title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Node States */
        .map-node.unlocked {
            background: var(--surface);
            border-color: rgba(255,255,255,0.2);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .map-node.unlocked .icon { filter: grayscale(0%) opacity(1); transform: scale(1.1); }
        .map-node.unlocked .title { color: var(--text); }
        .map-node.unlocked:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.3), inset 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .map-node.completed {
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.05);
        }
        .map-node.completed::before {
            content: '✓';
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--primary);
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 0 15px var(--primary-glow);
            z-index: 2;
        }
        .map-node.completed:not(:last-child)::after {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            height: 6px;
        }

        /* Trophy Specifics */
        .map-node.trophy.unlocked { border-color: var(--gold); background: rgba(255, 179, 0, 0.05); }
        .map-node.trophy.unlocked:hover { border-color: #ffd54f; box-shadow: 0 15px 40px var(--gold-glow); }
        .map-node.trophy.completed {
            background: radial-gradient(circle, rgba(255, 179, 0, 0.2) 0%, transparent 80%);
            border-color: var(--gold);
        }
        .map-node.trophy.completed::before { background: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }

        /* --- Level UI --- */
        .game-board {
            background: var(--surface);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(10px);
        }

        .level-header { margin-bottom: 40px; }
        .level-header h2 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .level-header p { margin: 0; color: var(--text-muted); font-size: 1.2rem; }

        .target-box {
            background: rgba(0,0,0,0.5);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            border-left: 4px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .target-label {
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .target-text {
            font-family: 'Fira Code', monospace;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: #fff;
            word-wrap: break-word;
        }

        input {
            width: 100%;
            padding: 20px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--locked-border);
            color: var(--primary);
            font-family: 'Fira Code', monospace;
            font-size: 1.4rem;
            text-align: center;
            outline: none;
            border-radius: 12px;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
            background: rgba(0, 242, 254, 0.05);
        }
        input::placeholder { color: #475569; }

        .btn-group { display: flex; gap: 20px; justify-content: center; }
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .btn-submit {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--primary-glow);
            background: #fff;
        }
        .btn-hint {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            color: var(--text);
        }
        .btn-hint:hover {
            border-color: var(--text);
            background: rgba(255,255,255,0.05);
        }
        .btn-back {
            background: transparent;
            color: var(--text-muted);
            margin-top: 30px;
            width: 100%;
            font-family: 'Rajdhani', sans-serif;
            border: 1px solid transparent;
        }
        .btn-back:hover { color: #fff; border-bottom: 1px solid #fff; border-radius: 0;}

        #message-area {
            margin-top: 30px;
            min-height: 50px;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        /* --- Interactive Trophy Modal --- */
        #trophy-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background: var(--surface);
            padding: 60px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 80px rgba(0,0,0,0.9), inset 0 0 50px rgba(255, 179, 0, 0.1);
            max-width: 500px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-icon {
            font-size: 6rem;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 30px var(--gold));
            animation: float 3s ease-in-out infinite;
        }
        .modal-title {
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            text-shadow: 0 0 20px rgba(255, 179, 0, 0.4);
        }
        .modal-desc { color: var(--text); font-size: 1.3rem; margin-bottom: 40px; line-height: 1.6; }
        .btn-claim {
            background: linear-gradient(135deg, var(--gold), #ff8f00);
            color: #000;
            width: 100%;
            font-size: 1.3rem;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.4);
        }
        .btn-claim:hover { box-shadow: 0 10px 40px var(--gold-glow); transform: translateY(-4px); color: #fff;}

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>

    <header>
        <h1>CipherQuest</h1>
    </header>

    <div id="view-map" class="view active">

        <div class="map-section" id="stage-1-container">
            <h2>STAGE 1 // BASIC PROTOCOLS</h2>
            <div class="stage-track" id="track-stage-1"></div>
        </div>

        <div class="map-section" id="stage-2-container">
            <h2>STAGE 2 // ADVANCED CASCADES</h2>
            <div class="stage-track" id="track-stage-2"></div>
        </div>

        <div class="map-section" id="stage-3-container">
            <h2>STAGE 3 // EXPERT SYSTEMS</h2>
            <div class="stage-track" id="track-stage-3"></div>
        </div>

        <div class="map-section" id="stage-4-container">
            <h2>STAGE 4 // MASTERY ALGORITHMS</h2>
            <div class="stage-track" id="track-stage-4"></div>
        </div>

    </div>

    <div id="view-level" class="view">
        <div class="game-board">
            <div class="level-header">
                <h2 id="lvl-title">Level Title</h2>
                <p id="lvl-desc">Instruction goes here</p>
            </div>

            <div class="target-box">
                <span class="target-label">Target Data Stream</span>
                <div class="target-text" id="lvl-target">TEXT</div>
            </div>

            <input type="text" id="lvl-input" placeholder="Execute cipher..." autocomplete="off">

            <div class="btn-group">
                <button class="btn-submit" onclick="submitAttempt()">Compile Payload</button>
                <button class="btn-hint" onclick="requestHint()">Run Diagnostics</button>
            </div>

            <div id="message-area"></div>

            <button class="btn-back" onclick="showMap()">[ Abort Node Execution ]</button>
        </div>
    </div>

    <div id="trophy-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">🏆</div>
            <h2 class="modal-title" id="modal-title">Stage Cleared</h2>
            <p class="modal-desc" id="modal-desc">Description</p>
            <button class="btn-claim" onclick="claimTrophy()">Initialize Next Sector</button>
        </div>
    </div>

<script>
    // Ensure FastAPI is running on Port 8000!
    const API_BASE = "http://localhost:8000";

    // --- GAME DATA ---
    const mapData = [
        // STAGE 1
        { id: 0, stage: 1, type: 'level', icon: '🔄', title: 'Reverse', desc: 'Read it backwards.', text: 'escape', endpoint: '/api/reverse/hint' },
        { id: 1, stage: 1, type: 'level', icon: '🏛️', title: 'Caesar', desc: 'Shift original text by +3', text: 'hello', endpoint: '/api/caesar/hint', key: '3' },
        { id: 2, stage: 1, type: 'level', icon: '🪞', title: 'Atbash', desc: 'A swaps Z, B swaps Y...', text: 'code', endpoint: '/api/atbash/hint' },
        { id: 3, stage: 1, type: 'level', icon: '🔠', title: 'Mono Sub', desc: 'Use Key: qwertyuiopasdfghjklzxcvbnm', text: 'test', endpoint: '/api/mono/hint', key: 'qwertyuiopasdfghjklzxcvbnm' },
        { id: 4, stage: 1, type: 'level', icon: '🔢', title: 'Fixed Num', desc: '0-9, a=10, b=11... z=35', text: 'hi', endpoint: '/api/fixed/hint' },
        { id: 5, stage: 1, type: 'trophy', icon: '🏅', title: 'Novice Hacker', desc: 'Basic firewall bypassed. You have earned access to Advanced Cascades.' },

        // STAGE 2
        { id: 6, stage: 2, type: 'level', icon: '🔀', title: 'Rev+Caesar', desc: 'Reverse text, THEN Shift by +4', text: 'apple', endpoint: '/api/lvl2/rev_caesar/hint', key: '4' },
        { id: 7, stage: 2, type: 'level', icon: '〰️', title: 'Alternating', desc: '+3 then -2 alternating based on index', text: 'secret', endpoint: '/api/lvl2/alternating/hint', key: '3,-2' },
        { id: 8, stage: 2, type: 'level', icon: '📈', title: 'Positional', desc: 'Shift index 0 by +1, index 1 by +2...', text: 'math', endpoint: '/api/lvl2/positional/hint' },
        { id: 9, stage: 2, type: 'level', icon: '🅰️', title: 'Vowel Scramble', desc: 'Vowels = 1 to 5. Space = #', text: 'hello world', endpoint: '/api/lvl2/vowel/hint' },
        { id: 10, stage: 2, type: 'level', icon: '🔑', title: 'Keyed Sub', desc: 'Alphabet starts with CRYPTO', text: 'data', endpoint: '/api/lvl2/keyed/hint', key: 'CRYPTO' },
        { id: 11, stage: 2, type: 'trophy', icon: '🥈', title: 'Pro Operator', desc: 'Advanced algorithms defeated. Expert Systems are now exposed.' },

        // STAGE 3
        { id: 12, stage: 3, type: 'level', icon: '➗', title: 'Mod Shift', desc: '(Index + 5) mod 26', text: 'secret', endpoint: '/api/lvl3/modular/hint', key: '5' },
        { id: 13, stage: 3, type: 'level', icon: '📜', title: 'Vigenère', desc: 'Polyalphabetic Shift using key: KEY', text: 'crypto', endpoint: '/api/lvl3/vigenere/hint', key: 'KEY' },
        { id: 14, stage: 3, type: 'level', icon: '✖️', title: 'Affine', desc: '(5 * Index + 8) mod 26', text: 'data', endpoint: '/api/lvl3/affine/hint', key: '5,8' },
        { id: 15, stage: 3, type: 'level', icon: '🌪️', title: 'Permutate', desc: 'Reorder blocks of 4 using index rule 2,0,1,3', text: 'hack', endpoint: '/api/lvl3/permutation/hint', key: '2,0,1,3' },
        { id: 16, stage: 3, type: 'level', icon: '🧱', title: 'Blk Rotate', desc: 'Reverse block, then Vigenère (Key: CAT)', text: 'secure', endpoint: '/api/lvl3/block_rotate/hint', key: 'CAT' },
        { id: 17, stage: 3, type: 'trophy', icon: '🥇', title: 'Elite Cryptographer', desc: 'Expert systems compromised. Proceed to Mastery Algorithms.' },

        // STAGE 4 (NEW)
        { id: 18, stage: 4, type: 'level', icon: '👯', title: 'Pairing', desc: '(a,b) becomes (a+b, a*b)', text: '3, 5', endpoint: '/api/lvl4/pairing/hint' },
        { id: 19, stage: 4, type: 'level', icon: '🔁', title: 'Rotate+Add', desc: 'Array + Reversed Array', text: '1, 2, 3', endpoint: '/api/lvl4/rotate_add/hint' },
        { id: 20, stage: 4, type: 'level', icon: '🎛️', title: 'Add Flip', desc: 'Add key mod 10, then reverse block', text: '1579_9181', endpoint: '/api/lvl4/additive_flip/hint', key: '1,3,5,7' },
        { id: 21, stage: 4, type: 'level', icon: '🔐', title: 'Mini RSA', desc: 'x^e mod n (Key e,n = 3,33)', text: '2, 3', endpoint: '/api/lvl4/rsa/hint', key: '3,33' },
        { id: 22, stage: 4, type: 'level', icon: '🌳', title: 'Merkle', desc: 'Iteratively hash pairs via (3x+5) mod 26', text: '2, 4, 6, 8', endpoint: '/api/lvl4/merkle/hint', key: '3,5' },
        { id: 23, stage: 4, type: 'trophy', icon: '👑', title: 'System God', desc: 'Total mainframe override achieved. You have mastered all protocols.' }
    ];

    // --- GAME STATE ---
    let maxUnlockedId = 0;
    let currentPlayingId = null;

    // --- DOM Elements ---
    const viewMap = document.getElementById('view-map');
    const viewLevel = document.getElementById('view-level');
    const msgArea = document.getElementById('message-area');
    const elInput = document.getElementById('lvl-input');
    const modal = document.getElementById('trophy-modal');

    // --- RENDER MAP TRACKS ---
    function renderMap() {
        [1, 2, 3, 4].forEach(stageNum => {
            const track = document.getElementById(`track-stage-${stageNum}`);
            if (!track) return;
            track.innerHTML = '';

            const stageNodes = mapData.filter(n => n.stage === stageNum);

            stageNodes.forEach(node => {
                const div = document.createElement('div');
                div.className = `map-node ${node.type}`;

                const isUnlocked = node.id <= maxUnlockedId;
                const isCompleted = node.id < maxUnlockedId;

                if (isUnlocked) div.classList.add('unlocked');
                if (isCompleted) div.classList.add('completed');

                div.innerHTML = `
                    <div class="icon">${isUnlocked ? node.icon : '🔒'}</div>
                    <div class="title">${isUnlocked ? node.title : 'LOCKED'}</div>
                `;

                if (isUnlocked) {
                    div.onclick = () => handleNodeClick(node);
                }

                track.appendChild(div);
            });
        });

        // Cascading Stage Visibility
        document.getElementById('stage-2-container').style.display = maxUnlockedId >= 6 ? 'block' : 'none';
        document.getElementById('stage-3-container').style.display = maxUnlockedId >= 12 ? 'block' : 'none';
        document.getElementById('stage-4-container').style.display = maxUnlockedId >= 18 ? 'block' : 'none';
    }

    // --- INTERACTIONS ---
    function handleNodeClick(node) {
        if (node.type === 'trophy') {
            if (node.id === maxUnlockedId) {
                // Open Cinematic Modal
                document.getElementById('modal-icon').textContent = node.icon;
                document.getElementById('modal-title').textContent = node.title;
                document.getElementById('modal-desc').textContent = node.desc;

                // Handle Final Trophy specific styling/text
                const btn = document.querySelector('.btn-claim');
                if (node.id === mapData.length - 1) {
                    btn.textContent = "[ INITIATE GLOBAL OVERRIDE ]";
                    btn.onclick = () => {
                        modal.style.display = 'none';
                        alert("Career Complete! The system is yours.");
                    };
                } else {
                    btn.textContent = "Initialize Next Sector";
                    btn.onclick = () => claimTrophy(node.id);
                }

                modal.style.display = 'flex';
            }
            return;
        }

        // Setup Level UI
        currentPlayingId = node.id;
        document.getElementById('lvl-title').textContent = `Node 0x0${node.id + 1}: ${node.title}`;
        document.getElementById('lvl-desc').textContent = `Directive: ${node.desc}`;
        document.getElementById('lvl-target').textContent = node.text;
        elInput.value = '';
        msgArea.textContent = '';

        // Switch Views
        viewMap.classList.remove('active');
        viewLevel.classList.add('active');
        elInput.focus();
    }

    function claimTrophy(id) {
        modal.style.display = 'none';
        maxUnlockedId++;
        renderMap();

        // Auto scroll down to the newly unlocked stage
        setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 150);
    }

    function showMap() {
        viewLevel.classList.remove('active');
        viewMap.classList.add('active');
        renderMap();
    }

    // --- API COMMUNICATION ---
    async function checkAPI(isSubmit) {
        const node = mapData[currentPlayingId];
        const attempt = elInput.value.trim();

        if (!attempt) {
            msgArea.style.color = "var(--error)";
            msgArea.style.textShadow = "0 0 10px var(--error-glow)";
            msgArea.textContent = "> ERR_EMPTY_PAYLOAD: Awaiting sequence stream.";
            return;
        }

        msgArea.style.color = "var(--primary)";
        msgArea.style.textShadow = "none";
        msgArea.textContent = "> Establishing socket to localhost:8000...";

        try {
            const response = await fetch(`${API_BASE}${node.endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    original_text: node.text,
                    user_attempt: attempt,
                    key: node.key || null
                })
            });

            if (!response.ok) throw new Error("API Offline");
            const data = await response.json();

            if (data.status === "success") {
                msgArea.style.color = "var(--success)";
                msgArea.style.textShadow = "0 0 10px rgba(0,230,118,0.5)";
                msgArea.textContent = "> SUCCESS: Payload Verified. Node Compromised.";

                if (currentPlayingId === maxUnlockedId) {
                    maxUnlockedId++;
                }

                setTimeout(() => showMap(), 1500);

            } else {
                if (isSubmit) {
                    msgArea.style.color = "var(--error)";
                    msgArea.style.textShadow = "0 0 10px var(--error-glow)";
                    msgArea.textContent = "> FATAL: Integrity check failed. Access denied.";
                    elInput.style.borderColor = "var(--error)";
                    setTimeout(() => elInput.style.borderColor = "var(--locked-border)", 500);
                } else {
                    msgArea.style.color = "var(--gold)";
                    msgArea.style.textShadow = "0 0 10px var(--gold-glow)";
                    msgArea.textContent = `> TRACE_LOG: ${data.message}`;
                }
            }
        } catch (err) {
            msgArea.style.color = "var(--error)";
            msgArea.style.textShadow = "0 0 10px var(--error-glow)";
            msgArea.textContent = "> CRITICAL_TIMEOUT: Mainframe offline. Ensure Python API is running.";
        }
    }

    function submitAttempt() { checkAPI(true); }
    function requestHint() { checkAPI(false); }

    elInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            submitAttempt();
        }
    });

    // Boot Sequence
    renderMap();
</script>
</body>
</html>
