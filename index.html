<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CipherQuest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="city-bg"></div>

      <header class="top-bar">
        <div class="logo">CipherQuest</div>
        <div class="player-strip">
          <div class="profile-avatar">A</div>
          <div class="player-meta">
            <div class="player-name">Agent Aryan</div>
            <div class="player-level">Level 07 Operative</div>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="hero-space">
          <div class="robot-float">
            <img
              id="robotImage"
              class="robot-img"
              src="assets/robot_hi.png"
              alt="Guide robot"
            />
          </div>

          <div class="chat-panel" id="chatAdvanceArea">
            <div class="chat-header">
              <span class="chat-title">Cipher</span>
            </div>
            <div class="chat-body" id="chatBody">
              <!-- Messages injected by JS -->
            </div>
            <div class="chat-footer">
              <div style="display: flex; gap: 12px; align-items: center;">
                <button class="chat-next-btn" id="nextStepBtn">Continue</button>
                <button class="skip-intro-text" id="skipIntroBtn">Skip intro</button>
              </div>
              <div class="chat-hint">Press Enter or click to continue</div>
            </div>
          </div>
        </section>

        <section class="modes-column">
          <div class="modes-card">
            <div class="modes-header">
              <h1 class="dashboard-title">Console Modes</h1>
              <p class="dashboard-subtitle">
                Choose your path and embark on your cipher-solving adventure!
              </p>
            </div>

            <div class="dashboard-grid">
              <button
                class="dash-tile"
                data-step="0"
                id="tileStoryMode"
                type="button"
              >
                <div class="dash-tile-label">Story Mode</div>
                <div class="dash-tile-tag">Campaign</div>
              </button>

              <button
                class="dash-tile"
                data-step="1"
                id="tileCipherLab"
                type="button"
              >
                <div class="dash-tile-label">CipherLab</div>
                <div class="dash-tile-tag">Puzzles</div>
              </button>

              <button
                class="dash-tile"
                data-step="2"
                id="tileMultiplayer"
                type="button"
              >
                <div class="dash-tile-label">Multiplayer</div>
                <div class="dash-tile-tag">Co-op</div>
              </button>

              <button
                class="dash-tile"
                data-step="3"
                id="tileTrainingAcademy"
                type="button"
              >
                <div class="dash-tile-label">Training Academy</div>
                <div class="dash-tile-tag">Practice</div>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
